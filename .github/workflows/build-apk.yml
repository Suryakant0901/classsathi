name: Build ClassSathi Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Assets
        run: |
          cd client
          npm install
          npm run build
          npx cap update android
          npx cap copy android

      - name: Setup Android SDK Platform 36 & Accept Licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Executable
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd client/android
          if ! ./gradlew assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1; then
            echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_log.txt
            exit 1
          fi

      - name: Prepare APK Asset
        run: cp client/android/app/build/outputs/apk/debug/app-debug.apk ClassSathi-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassSathi-Attendance-APK
          path: ClassSathi-v1.0.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "ClassSathi v1.0.3 APK (Live Class 9 & 10 Dashboard Breakdown + Native File Download)"
          body: "ClassSathi Android APK v1.0.3:\n- Immediate dashboard live refresh when attendance is recorded or updated.\n- Live separate breakdown of Present & Absent counts for both Class 9 and Class 10 on the Dashboard.\n- Native Android PDF & Excel download and share support via Capacitor Filesystem and Share plugins.\n- Complete standalone autonomous school operation without Wi-Fi."
          files: ClassSathi-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
