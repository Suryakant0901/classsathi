name: Build ClassSathi Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Assets
        run: |
          cd client
          npm install
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Make Gradle Executable
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassSathi-Attendance-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
